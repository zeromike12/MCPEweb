<!doctype html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Minecraft</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            overscroll-behavior: none;
        }

        canvas.emscripten {
            display: block;
            outline: none;
            width: 100vw;
            height: 100vh;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type='text/javascript'>
        var Module = {
            canvas: (function () { return document.getElementById('canvas'); })()
        };

        (function () {
            var canvas = document.getElementById('canvas');

            // Handle Native Mouse Clicks to lock pointer only for REAL mice
            canvas.addEventListener('mousedown', function (e) {
                if (e.isTrusted && !document.pointerLockElement && !window.mcMenuOpen) {
                    canvas.requestPointerLock();
                }
            });

            // Prevent default touch behaviors on the canvas (like scrolling, pinch-zoom, pull-to-refresh)
            var preventTouchDefault = function (e) {
                e.preventDefault();
            };
            canvas.addEventListener('touchstart', preventTouchDefault, { passive: false });
            canvas.addEventListener('touchmove', preventTouchDefault, { passive: false });
            canvas.addEventListener('touchend', preventTouchDefault, { passive: false });
            canvas.addEventListener('touchcancel', preventTouchDefault, { passive: false });

            // Block document-level default touch behaviours (scroll / zoom),
            // but allow user input on dialogs/modals
            document.addEventListener('touchstart', function (e) {
                var t = e.target.tagName;
                if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'BUTTON' && t !== 'SELECT' && t !== 'OPTION') {
                    e.preventDefault();
                }
            }, { passive: false });
            document.addEventListener('touchmove', function (e) {
                var t = e.target.tagName;
                if (t !== 'INPUT' && t !== 'TEXTAREA' && t !== 'BUTTON' && t !== 'SELECT' && t !== 'OPTION') {
                    e.preventDefault();
                }
            }, { passive: false });
        })();
    </script>
    <script type='text/javascript'>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    }, err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
    {{{ SCRIPT }}}
</body>

</html>
